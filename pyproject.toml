[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plainspeak"
version = "0.3.0"
description = "A readability analysis and text simplification toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PlainSpeak Project"}
]
keywords = ["readability", "plain-language", "accessibility", "text-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Government",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.0",
    # CommonMark parsing for the document representation. Reports a line
    # range for every block token, which is what makes exact source
    # offsets — and therefore safe editing — possible at all.
    "markdown-it-py>=3.0",
    # Declarative rules are YAML, parsed with safe_load only. Rules are data:
    # nothing in a rule file can reach the interpreter.
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The desktop application. Deliberately optional: importing `plainspeak`
# must never require Qt, and engine-only users should not pay a ~100 MB
# dependency for a GUI they will not open.
#
# Floor 6.8 is the oldest release tested here; the 6.12 ceiling is the next
# minor, because Qt for Python has moved API between minors before and an
# untested minor is not a supported one.
desktop = ["PySide6>=6.8,<6.12"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
web = [
    "flask>=3.0",
]
docx = [
    "python-docx>=0.8",
]
pdf = [
    "pypdf>=3.0",
]
all = [
    "flask>=3.0",
    "python-docx>=0.8",
    "pypdf>=3.0",
]

[project.scripts]
plainspeak = "plainspeak.adapters.cli:main"
plainspeak-web = "plainspeak.adapters.web:main"
plainspeak-desktop = "plainspeak.desktop.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plainspeak*"]

# The CMU syllable dictionary is a 1.8 MB marshal blob loaded at runtime.
# Without this it is left out of built wheels and every syllable count
# silently falls back to the heuristic.
[tool.setuptools.package-data]
"plainspeak.core" = ["*.bin"]
# The bundled ruleset. Without this the engine installs with no rules at all and
# silently proposes nothing, which is the same shape of defect the syllable
# dictionary had before Phase 2.
"plainspeak.rules" = ["bundled/*.yaml", "bundled/**/*.yaml"]
# The bundled style profiles. Same defect shape as the two above: without
# this the pack is absent from wheels and every profile lookup fails, while
# editable installs keep working perfectly.
"plainspeak.style.profiles" = ["bundled/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
