[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plainspeak"
version = "0.3.0"
description = "A readability analysis and text simplification toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PlainSpeak Project"}
]
keywords = ["readability", "plain-language", "accessibility", "text-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Government",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
web = [
    "flask>=3.0",
]
docx = [
    "python-docx>=0.8",
]
pdf = [
    "pypdf>=3.0",
]
all = [
    "flask>=3.0",
    "python-docx>=0.8",
    "pypdf>=3.0",
]

[project.scripts]
plainspeak = "plainspeak.adapters.cli:main"
plainspeak-web = "plainspeak.adapters.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["plainspeak*"]

# The CMU syllable dictionary is a 1.8 MB marshal blob loaded at runtime.
# Without this it is left out of built wheels and every syllable count
# silently falls back to the heuristic.
[tool.setuptools.package-data]
"plainspeak.core" = ["*.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
