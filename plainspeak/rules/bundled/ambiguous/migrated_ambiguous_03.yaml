id: PS.LEXICAL.162
version: 1
name: gratuitous-is-ambiguous
mode: diagnostic
description: >
  The inherited glossary suggested replacing "gratuitous" with
  "free". This engine reports it instead: usually means unjustified, not free: 'gratuitous violence' became 'free violence'.
match:
  type: word
