# 30 terms the inherited glossary would substitute, and this engine
# will not.
#
# Each is worth flagging and cannot be replaced mechanically: a word with two
# senses, a gloss standing in for a definition, or a replacement the integrity
# firewall would veto. The reason travels with the rule, because a reader told
# only that a word is complex has been given nothing to act on.
#
# Generated by tools/build_glossary_inventory.py from migration/decisions.yaml.

id: PS.LEXICAL.125
version: 1
name: constitute-is-ambiguous
mode: diagnostic
description: >
  The inherited glossary suggested replacing "constitute" with
  "make up". This engine reports it instead: 'this constitutes a breach' became 'this makes up a breach'.
match:
  type: word
  text: "constitute"
scope:
  include: [prose]
priority: 70
reason:
  short: "'this constitutes a breach' became 'this makes up a breach'"
provenance:
  source: "PlainSpeak inherited glossary, reviewed and kept as a diagnostic"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The notice used the word constitute here."
  negative:
    - "A different word entirely appears instead."

