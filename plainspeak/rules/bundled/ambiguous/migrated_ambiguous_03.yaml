scope:
  include: [prose]
priority: 70
reason:
  short: "usually means unjustified, not free: 'gratuitous violence' became 'free violence'"
provenance:
  source: "PlainSpeak inherited glossary, reviewed and kept as a diagnostic"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The notice used the word gratuitous here."
  negative:
    - "A different word entirely appears instead."

