ruleset_version: "2026.2"
description: >
  The rules PlainSpeak Next ships with. Every rule states what it matches,
  what it would do, why, where it came from, and the cases where it must stay
  quiet.

  2026.2 adds the reviewed part of the inherited PlainSpeak glossary. The
  glossary was source material, not a policy: every one of its 706 entries was
  classified, and only those individually judged mechanically substitutable
  became rules. The rest are diagnostics, deferred or rejected, and
  GLOSSARY_MIGRATION.md accounts for all of them.

  The bias throughout is towards refusing. Being able to detect a phrase is not
  the same as being able to rewrite it safely, and where grammar or meaning
  could depend on context the rule is a diagnostic.
