id: PS.LEXICAL.190
version: 1
name: obsolete-to-outdated
mode: safe-fix
description: >
  "Obsolete" is "outdated" in plainer words. Migrated from the
  inherited glossary after individual review; the forms this matches are
  listed in the rule explanation rather than inferred.
match:
  type: word
  text: "obsolete"
action:
  type: replace
  replacement: "outdated"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"outdated\" is the everyday word"
provenance:
  source: "PlainSpeak inherited glossary, individually reviewed and re-authored"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The report used the word obsolete."
  negative:
    - "The token obsoleter is a different word."
  transform:
    - before: "The report used the word obsolete."
      after: "The report used the word outdated."

