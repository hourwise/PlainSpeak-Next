id: PS.LEXICAL.011
version: 1
name: demonstrate-to-show
mode: safe-fix
description: >
  "Demonstrate" in the sense of showing evidence. The protest sense takes a
  different grammatical frame — "demonstrate against" — and would read oddly
  rather than wrongly, which is the level of risk this rule accepts.
match:
  type: word
  text: "demonstrate"
action:
  type: replace
  replacement: "show"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"show\" is the everyday word"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "You must demonstrate that you live in the area."
  negative:
    - "A demonstration was held outside."
  transform:
    - before: "You must demonstrate that you live in the area."
      after: "You must show that you live in the area."

---
id: PS.LEXICAL.012
version: 1
name: aforementioned
mode: diagnostic
description: >
  Archaic and worth removing, but not by substitution. "The aforementioned
  document" does not become "the this document"; it becomes "that document" or
  simply "it", and which one depends on what was mentioned. A person has to
  choose.
match:
  type: word
  text: "aforementioned"
scope:
  include: [prose]
priority: 80
reason:
  short: "Archaic; name the thing instead"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a diagnostic"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The aforementioned document is enclosed."
  negative:
    - "The document mentioned above is enclosed."
