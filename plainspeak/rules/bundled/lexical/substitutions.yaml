id: PS.LEXICAL.005
version: 1
name: commence-to-start
mode: safe-fix
description: >
  "Commence" is "start" in a formal register. The formality is the only
  difference, and it is the thing plain language is trying to remove.
match:
  type: word
  text: "commence"
action:
  type: replace
  replacement: "start"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"start\" is the everyday word"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The hearing will commence at ten."
  negative:
    - "The commencement of the term is in September."
  transform:
    - before: "The hearing will commence at ten."
      after: "The hearing will start at ten."

