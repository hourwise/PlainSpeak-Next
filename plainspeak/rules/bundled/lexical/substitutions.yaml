# Single-word substitutions.
#
# One rule per inflected form, on purpose. The inherited engine derived forms by
# stripping suffixes and produced non-words — "clarity" suggesting the verb
# "clare" — and the lesson taken from that is that a rule must match exactly
# what it says it matches. There is no stemmer here and no hidden morphology: if
# a form is not written down, it is not matched.
#
# Words whose meaning shifts between noun and verb, or that carry a settled
# sense in law or medicine, are diagnostics. "Purchase" and "provide" are the
# obvious traps: "the purchase price" is not "the buy price", and "provide
# evidence" is not quite "give evidence".

id: PS.LEXICAL.001
version: 1
name: utilise-to-use
mode: safe-fix
description: >
  "Utilise" and "use" are interchangeable in ordinary prose. Where the two do
  differ — "utilise" implying making practical use of something not designed
  for it — the distinction is not one most readers draw.
match:
  type: word
  text: "utilise"
  forms: ["utilize"]
action:
  type: replace
  replacement: "use"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"use\" is the everyday word"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "Staff utilise the register daily."
    - "Please utilize the online form."
  negative:
    - "The utiliser of the service must register."
  transform:
    - before: "Staff utilise the register daily."
      after: "Staff use the register daily."

