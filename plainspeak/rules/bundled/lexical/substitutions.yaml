id: PS.LEXICAL.009
version: 1
name: additional-to-extra
mode: safe-fix
description: >
  "Additional" is "extra". The phrase "additional insured" is a term of art and
  is protected separately by PS.PROTECT.002, which takes precedence over this
  rule wherever the two overlap.
match:
  type: word
  text: "additional"
action:
  type: replace
  replacement: "extra"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"extra\" is the everyday word"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "Please send additional documents."
  negative:
    - "Additions to the register are published monthly."
  transform:
    - before: "Please send additional documents."
      after: "Please send extra documents."

