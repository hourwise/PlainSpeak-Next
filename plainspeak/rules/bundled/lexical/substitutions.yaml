id: PS.LEXICAL.007
version: 1
name: approximately-to-about
mode: safe-fix
description: >
  Both words mark an estimate. The number they qualify is untouched, which is
  what matters: this rule must never change a figure, only the hedge in front
  of it.
match:
  type: word
  text: "approximately"
action:
  type: replace
  replacement: "about"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"about\" marks an estimate just as well"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "The journey takes approximately 40 minutes."
  negative:
    - "The approximation was close enough."
  transform:
    - before: "The journey takes approximately 40 minutes."
      after: "The journey takes about 40 minutes."

