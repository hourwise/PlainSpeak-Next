id: PS.LEXICAL.010
version: 1
name: ascertain-to-find-out
mode: safe-fix
description: >
  A Latinate verb with a plain phrasal equivalent. The replacement is two words
  rather than one, which the engine handles as an ordinary span replacement.
match:
  type: word
  text: "ascertain"
action:
  type: replace
  replacement: "find out"
scope:
  include: [prose]
case:
  policy: preserve
priority: 100
reason:
  short: "\"find out\" is the everyday phrase"
provenance:
  source: "PlainSpeak inherited glossary, re-authored as a rule"
  reference: "plainspeak/core/glossary.py"
  licence: "project-authored"
examples:
  positive:
    - "We will ascertain whether the claim is valid."
  negative:
    - "The ascertainment of facts took two weeks."
  transform:
    - before: "We will ascertain whether the claim is valid."
      after: "We will find out whether the claim is valid."

