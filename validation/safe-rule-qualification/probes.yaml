    control: ["These photos depict the damage."]
  PS.LEXICAL.137:
    category: verb ("designate" -> "choose")
    normal: ["Please designate a contact.", "Each team designates a lead."]
    adversarial: ["The Secretary of State may designate an area as a conservation area."]
