    adversarial: ["This is a necessary and sufficient condition.", "The evidence was sufficient to convict.", "Sufficient unto the day."]
    specialist: ["Consideration must be sufficient but need not be adequate.", "Necessary and sufficient conditions are listed below."]
    control: ["Allow sufficient time for delivery."]
  PS.LEXICAL.011:
    category: verb, base form ("demonstrate" -> "show")
