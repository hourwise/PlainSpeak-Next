    control: ["Records corroborate the dates."]
  PS.LEXICAL.132:
    category: adjective ("deficient" -> "lacking")
    normal: ["The diet is deficient in iron.", "The report was deficient in detail."]
    adversarial: ["The patient is vitamin D deficient.", "They provided a deficient service."]
    specialist: ["The works were found deficient on inspection."]
    control: ["Soil deficient in nitrogen needs feeding."]
  PS.LEXICAL.133:
    category: adjective ("definitive" -> "final")
    normal: ["This is the definitive version.", "No definitive answer was given."]
    adversarial: ["The parties signed a definitive agreement."]
    specialist: ["A biopsy is needed for a definitive diagnosis."]
    control: ["We will publish the definitive list."]
  PS.LEXICAL.134:
    category: verb ("delineate" -> "outline")
    normal: ["The plan delineates each role.", "Boundaries were delineated."]
    adversarial: ["Clearly delineated zones reduce risk."]
