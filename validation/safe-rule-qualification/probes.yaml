# Probe sentences for every automatic rule in ruleset 2026.7 (97 rules).
#
# Each rule gets sentences in four groups. Most were written before any output
# was captured or any disposition decided. After the first run, a second pass
# added sentences for the rules the first pass had not settled. The groups:
#
#   normal       ordinary uses the rule was written for
#   adversarial  position, part of speech, participles, pronoun objects,
#                phrasal verbs, infinitive complements, fixed expressions,
#                punctuation, capitalisation
#   specialist   legal, procedural, finance, accounting, clinical, technical,
#                government — wherever the word plausibly works as a term
#   control      further ordinary uses, so the audit is not built to demote;
#                a qualified rule must apply every one
#
# qualify.py runs every sentence through `present` and records
# what the rule actually did. Judgements are in dispositions.yaml.

rules:
  PS.CLARITY.002:
    category: phrase — subordinating conjunction ("due to the fact that" -> "because")
    normal: ["The meeting was cancelled due to the fact that the chair was ill.", "Due to the fact that the office is closed, calls are diverted."]
    adversarial: ["The delay is due to the fact that the supplier failed.", "It was not due to the fact that we were late.", "Largely due to the fact that prices rose, sales fell."]
    specialist: ["The claim failed due to the fact that the limitation period had expired."]
    control: ["The system crashed due to the fact that the disk was full."]
  PS.CLARITY.003:
    category: phrase — adverbial ("at this point in time" -> "now")
    normal: ["At this point in time, we cannot confirm the date.", "We have no vacancies at this point in time."]
    adversarial: ["The plan was sound at this point in time, but not later.", "Is it wise, at this point in time, to proceed?"]
    specialist: ["The court is not persuaded that, at this point in time, an injunction is necessary.", "At this point in time, the claimant had not been paid."]
    control: ["No further action is required at this point in time."]
  PS.CLARITY.004:
    category: phrase — conditional conjunction ("in the event that" -> "if")
    normal: ["In the event that you are late, call the office.", "We will refund you in the event that the flight is cancelled."]
    adversarial: ["Only in the event that the server fails will the backup run.", "Except in the event that notice is given, the lease continues.", "In the event that, as expected, it rains, the match moves indoors."]
    specialist: ["In the event that the Tenant defaults, the Landlord may terminate this lease."]
    control: ["In the event that a fire alarm sounds, leave the building."]
  PS.CLARITY.005:
    category: phrase — prepositional ("for the purpose of" -> "for")
    normal: ["The room is used for the purpose of training.", "Data is collected for the purpose of improving the service."]
    adversarial: ["For the purpose of this letter, we means the council.", "The money was taken for the purpose of fraud.", "The sum was paid for the purpose of the repairs.", "For the purposes of this Act, a child is a person under 18."]
    specialist: ["For the purpose of section 5, a dwelling includes a caravan.", "For the purpose of this Agreement, Business Day means a day on which banks are open."]
    control: ["The vehicle may only be used for the purpose of deliveries."]
  PS.CLARITY.006:
    category: phrase — concessive conjunction ("in spite of the fact that" -> "although")
    normal: ["In spite of the fact that it rained, the event went ahead.", "We continued in spite of the fact that funding was cut."]
    adversarial: ["She was hired in spite of the fact that, strictly, she lacked the degree."]
    specialist: ["The appeal was allowed in spite of the fact that the notice was late."]
    control: ["In spite of the fact that sales fell, profits rose."]
  PS.CLARITY.008:
    category: phrase — adverbial ("in the near future" -> "soon")
    normal: ["We will publish the report in the near future.", "In the near future, the office will move."]
    adversarial: ["A decision is not expected in the near future.", "Rates may rise at some point in the near future.", "It is unlikely to happen in the near future."]
    specialist: ["The Department intends to consult in the near future."]
    control: ["New features will be released in the near future."]
  PS.CLARITY.009:
    category: phrase — preposition ("prior to" -> "before"); an integrity equivalence
    normal: ["Please arrive prior to the meeting.", "Prior to the hearing, file the bundle."]
    adversarial: ["The prior agreement still applies.", "It must be signed prior to, and not after, completion.", "Check the settings prior to installing."]
    specialist: ["The patient must fast for 6 hours prior to surgery.", "Notice must be given prior to the Completion Date.", "The first charge ranks prior to the second charge."]
    control: ["Back up your files prior to the upgrade."]
  PS.CLARITY.010:
    category: phrase — adverbial ("on a regular basis" -> "regularly")
    normal: ["Staff are paid on a regular basis.", "Check the filters on a regular basis."]
    adversarial: ["On a regular basis, the system backs up.", "Is it used on a regular basis?"]
    specialist: ["Blood pressure should be monitored on a regular basis."]
    control: ["The committee meets on a regular basis."]
  PS.FRAMING.001:
    category: framing deletion ("it is important to note that " -> nothing)
    normal: ["It is important to note that the deposit is non-refundable.", "However, it is important to note that the office is closed."]
    adversarial: ["It is important to note that no refunds are given.", "Staff said it is important to note that the rules changed."]
    specialist: ["It is important to note that this letter does not constitute legal advice."]
    control: ["It is important to note that prices may change."]
  PS.FRAMING.002:
    category: framing deletion ("it is worth noting that " -> nothing)
    normal: ["It is worth noting that exports fell.", "Finally, it is worth noting that the survey was small."]
    adversarial: ["It is worth noting that not every site replied.", "They said it is worth noting that costs rose."]
    specialist: ["It is worth noting that the trial excluded children."]
    control: ["It is worth noting that the data is provisional."]
  PS.FRAMING.003:
    category: framing deletion ("it should be noted that " -> nothing)
    normal: ["It should be noted that the office is closed.", "It should be noted that fees apply."]
    adversarial: ["However, it should be noted that the data is incomplete."]
    specialist: ["It should be noted that the Respondent did not attend."]
    control: ["It should be noted that the figures are estimates."]
  PS.LEXICAL.001:
    category: verb, base form ("utilise" -> "use")
    normal: ["Please utilise the new portal.", "Staff should utilise the register."]
    adversarial: ["We must utilise it before it expires.", "Utilise the form, not the email.", "Submit a Utilisation Request before the Utilisation Date."]
    specialist: ["Hospitals should utilise spare theatre capacity."]
    control: ["You can utilise the car park after 6pm."]
  PS.LEXICAL.002:
    category: verb, third person ("utilises" -> "uses")
    normal: ["The service utilises cloud storage.", "Each team utilises the same template."]
    adversarial: ["It utilises them sparingly."]
    specialist: ["The algorithm utilises a hash table."]
    control: ["The factory utilises solar power."]
  PS.LEXICAL.003:
    category: verb, past / participle ("utilised" -> "used")
    normal: ["The funds were utilised for repairs.", "We utilised the spare room."]
    adversarial: ["Utilised capacity rose to 80%.", "The utilised portion is shown in red."]
    specialist: ["The borrower has utilised the full facility."]
    control: ["The data was utilised in the report."]
  PS.LEXICAL.004:
    category: verb, present participle ("utilising" -> "using")
    normal: ["Utilising the new system saves time.", "We are utilising the grant."]
    adversarial: ["By utilising it, you agree to the terms."]
    specialist: ["The study was conducted utilising a randomised design."]
    control: ["Staff are utilising the training budget."]
  PS.LEXICAL.005:
    category: verb, base form ("commence" -> "start")
    normal: ["Work will commence on Monday.", "The course will commence in May."]
    adversarial: ["Please commence it immediately.", "Commence the test when ready."]
    specialist: ["The claimant may commence proceedings.", "This section shall commence on 1 April.", "The lease will commence on the Commencement Date."]
    control: ["Building works commence next week."]
  PS.LEXICAL.006:
    category: verb, past / participle ("commenced" -> "started")
    normal: ["Work commenced on Monday.", "The trial has commenced."]
    adversarial: ["Once commenced, the process cannot stop."]
    specialist: ["Proceedings were commenced in the High Court.", "Employment commenced on 1 June."]
    control: ["The survey commenced last spring."]
  PS.LEXICAL.007:
    category: adverb ("approximately" -> "about")
    normal: ["It costs approximately £40.", "The journey takes approximately two hours."]
    adversarial: ["The values are approximately equal.", "Approximately, how many attended?"]
    specialist: ["Give approximately 5 mg per kg.", "The function returns approximately the square root."]
    control: ["Approximately 300 people replied."]
  PS.LEXICAL.008:
    category: adjective ("sufficient" -> "enough")
