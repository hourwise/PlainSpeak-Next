    control: ["He is contemplating retirement."]
  PS.LEXICAL.129:
    category: noun, clinical ("contusion" -> "bruise")
    normal: ["He had a contusion on his arm.", "Minor contusions were noted."]
    adversarial: ["CT showed a cerebral contusion."]
    specialist: ["The patient has a pulmonary contusion."]
    control: ["A small contusion was dressed."]
  PS.LEXICAL.131:
    category: verb ("corroborate" -> "support")
