    specialist: ["Estoppel requires detrimental reliance on the promise."]
    control: ["Delays are detrimental to patients."]
  PS.LEXICAL.140:
    category: verb ("discontinue" -> "stop")
    normal: ["Discontinue the medicine if you feel dizzy.", "The service was discontinued."]
