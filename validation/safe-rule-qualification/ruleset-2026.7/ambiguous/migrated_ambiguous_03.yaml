  "help". This engine reports it instead: 'facilitate X' is 'make X easier', and 'help X' is 'assist X': 'facilitate the completion of the task' became 'help the completion of the task' (field report FIELD-001 on 1.0.0), 'facilitates access to' became 'helps access to', 'facilitate payment' became 'help payment'.
