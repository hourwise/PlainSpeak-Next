    before_corpus: tech-api-reference
    after: |
      ## POST /v2/orders

      Creates an order. The request body must be JSON and must not exceed 64 KB.

      | Field | Type | Required |
      |---|---|---|
      | `customer_id` | string | yes |
      | `items` | array | yes |
      | `notes` | string | no |

      Returns `201 Created` with the order object. If `items` is empty, the API returns `422` and does not create an order. Each API key can make up to 100 requests per minute; further requests receive `429` until the window resets.

      You cannot modify an order after 24 hours. To change an older order, cancel it and create a new one.
    meaning: preserved
    protected: false
    note: rate limit restated as "can make up to 100"

