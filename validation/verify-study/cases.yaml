# The Verify validation study: before/after pairs with a manual judgement each.
#
# Judgements were written BEFORE verify was run on any case, and are not
# changed to agree with it. Fields:
#
#   class       plainspeak | human | claude | chatgpt-style | local-model-style
#               | aggressive | technical | specification | already-good | probe
#   producer    who or what produced `after`, stated truthfully. Nothing here
#               was generated by calling an external model; cases in the
#               chatgpt-style and local-model-style classes were written for
#               this study to be representative of those systems' habits.
#   before      inline text, or before_corpus (tests/acceptance/corpus/<name>.md)
#               or before_source (validation/verify-study/sources/<name>.md)
#   after       inline text, or `present: <profile>` for PlainSpeak's own output
#   meaning     preserved | changed — whether a careful reader would say the
#               information and commitments survived (tone alone does not count)
#   protected   true when a meaning change touches something the integrity
#               model protects: a number, date, amount, unit, negation, modal,
#               comparator, identifier, term of art, code, quotation or link
#   note        what changed, in a few words

cases:

  # ── PlainSpeak's own presentation ─────────────────────────────────────────
  # Generated: every corpus document against `present --profile natural`.
  # Judgement: preserved (V1 acceptance review, V1_ACCEPTANCE_REVIEW.md).
  - id: P-corpus
    class: plainspeak
    producer: plainspeak present --profile natural, for all 27 acceptance-corpus documents
    before_corpus: "*"
    after: {present: natural}
    meaning: preserved
    protected: false
    note: PlainSpeak's own SAFE changes

