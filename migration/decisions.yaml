# ── Demonstrably wrong, not carried forward ────────────────────────────────
#
# The inherited path stays sealed and keeps these; the declarative engine does
# not have to reproduce upstream's mistakes.
rejected:
  - {term: certiorari, reason: "'review' names the wrong thing: it is a specific appellate writ"}
  - {term: estoppel, reason: "'barred from denying' is a definition fragment, not a replacement"}
  - {term: laches, reason: "'unreasonable delay' is a definition, and the doctrine is more than delay"}
